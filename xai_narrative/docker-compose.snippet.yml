# For Abhishek: add these two services to the project's docker-compose.yml
services:
  narrative-xai:
    build: ./xai_narrative
    ports: ["8100:8100"]
    environment:
      NARRATIVE_LLM: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
    depends_on: [ollama]
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    # GPU (optional):
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}
    # first run:  docker compose exec ollama ollama pull llama3.1:8b
volumes:
  ollama:
