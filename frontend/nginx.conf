# Static hosting for the dashboard.
#
# Two things this config is deliberate about:
#
#  1. It listens on 8080 and keeps every write target under /tmp, so the container
#     runs as the unprivileged `nginx` user with no elevated ports or capabilities.
#
#  2. The WebSocket is NOT proxied. The browser connects to the gateway directly
#     (VITE_GATEWAY_WS), so nginx never buffers the telemetry stream — an accidental
#     proxy here would add a queue in front of a pipeline whose whole design is
#     drop-don't-queue. The gateway also validates the Origin header itself.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Must match the module path nginx was built with.
    include /etc/nginx/mime.types;

    # Container-local health probe target (used by HEALTHCHECK).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable: cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a reload keeps serving a stale bundle that
    # points at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths fall back to the shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dashboard is a monitoring UI; framing it opens a clickjacking surface.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
