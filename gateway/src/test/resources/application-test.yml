server:
  port: 0  # Random port for testing

spring:
  main:
    allow-bean-definition-overriding: true

vision:
  service:
    url: http://localhost:9999  # Non-existent — tests replace VisionServiceClient with a mock
    timeout-seconds: 2

narrative:
  service:
    ws-url: ws://localhost:9998  # Non-existent — tests replace NarrativeBridge with a mock
    reconnect-seconds: 1
    send-buffer: 8

gateway:
  backpressure:
    warn-after-drops: 5
  allowed-origins: http://localhost:5173
  max-frame-bytes: 524288
  metrics-interval-seconds: 60
